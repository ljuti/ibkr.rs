# cargo-deny configuration (0.16+). Run with `just deny`.
#
# Checks licenses, security advisories, dependency bans and source integrity.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only; anything copyleft needs an explicit decision.
# Keep this list to what the dependency tree actually uses — an unused
# allowance is dead configuration that hides what is really permitted.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # Zlib: foldhash, pulled in by rusqlite's hashbrown. Permissive and
    # OSI-approved, same class as MIT/BSD.
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
